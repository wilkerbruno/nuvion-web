<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Nuvion Web</title>
    <style>
      :root {
        --bg: #0b1119;
        --surface: #121a24;
        --surface-2: #1a2430;
        --text: #e7ecf2;
        --text-muted: #93a2b3;
        --border: #29343f;
        --accent: #2fbfa6;
        --accent-strong: #57d6be;
        --danger: #e8785a;
        --danger-soft: rgba(232, 120, 90, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 300px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
      }

      .wrap {
        padding: 16px;
      }

      .brand {
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 12px;
      }

      .brand span {
        color: var(--accent);
      }

      .field {
        margin-bottom: 12px;
      }

      .label {
        display: block;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      .input {
        width: 100%;
        padding: 8px 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 13px;
      }

      .input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .btn {
        width: 100%;
        padding: 9px 12px;
        background: var(--accent);
        color: #06231e;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn:hover {
        background: var(--accent-strong);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        margin-top: 8px;
      }

      .btn-secondary:hover {
        background: var(--surface);
      }

      .btn-link {
        display: block;
        width: 100%;
        background: none;
        border: none;
        color: var(--accent-strong);
        cursor: pointer;
        padding: 8px 0 0;
        font-size: 12px;
        text-align: center;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .header .brand {
        margin-bottom: 0;
      }

      .icon-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-muted);
        cursor: pointer;
        width: 28px;
        height: 28px;
        font-size: 14px;
        line-height: 1;
      }

      .icon-btn:hover {
        color: var(--text);
        border-color: var(--text-muted);
      }

      .error {
        background: var(--danger-soft);
        border: 1px solid var(--danger);
        color: var(--danger);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 12px;
        margin-bottom: 12px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .card .line {
        margin-bottom: 4px;
      }

      .card .line:last-child {
        margin-bottom: 0;
      }

      .muted {
        color: var(--text-muted);
        font-size: 12px;
      }

      .tools-list {
        max-height: 220px;
        overflow-y: auto;
        margin-top: 6px;
      }

      .tool-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }

      .tool-row:last-child {
        border-bottom: none;
      }

      .tool-name {
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tool-open-btn {
        flex-shrink: 0;
        padding: 5px 10px;
        background: var(--accent);
        color: #06231e;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .tool-open-btn:hover {
        background: var(--accent-strong);
      }

      .tool-open-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="brand">Nuvion<span>Web</span></div>
        <button id="settings-button" class="icon-btn" type="button" title="Configurações">⚙</button>
      </div>

      <section id="login-view">
        <div id="login-error" class="error" hidden></div>
        <form id="login-form">
          <div class="field">
            <label class="label" for="username">Usuário ou email</label>
            <input id="username" class="input" type="text" required autocomplete="username" />
          </div>
          <div class="field">
            <label class="label" for="password">Senha</label>
            <input id="password" class="input" type="password" required autocomplete="current-password" />
          </div>
          <button id="login-button" class="btn" type="submit">Entrar</button>
        </form>
        <button class="btn-link" type="button" data-open-dashboard>Criar conta no painel</button>
      </section>

      <section id="status-view" hidden>
        <div id="status-error" class="error" hidden></div>
        <div class="card">
          <div id="user-line" class="line">—</div>
          <div id="account-line" class="line muted">—</div>
        </div>
        <div class="card">
          <div id="proxy-line" class="line muted">—</div>
          <button id="reapply-button" class="btn btn-secondary" type="button">
            Reaplicar proxy
          </button>
        </div>
        <div class="card">
          <div id="notifications-line" class="line muted">—</div>
        </div>
        <div class="card">
          <div class="line muted">Ferramentas de IA</div>
          <div id="tools-list" class="tools-list">
            <div class="muted">Carregando...</div>
          </div>
        </div>
        <button class="btn-link" type="button" data-open-dashboard>Abrir painel</button>
        <button id="logout-button" class="btn btn-secondary" type="button">Sair</button>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
