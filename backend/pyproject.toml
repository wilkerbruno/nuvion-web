[project]
name = "nuvion-web-backend"
version = "0.1.0"
description = "API do Nuvion Web — painel de gestão e camada de dados compartilhada com a extensão de navegação."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
